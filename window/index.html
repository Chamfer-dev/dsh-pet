<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; img-src data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>dsh pet</title>
    <link rel="stylesheet" href="pet.css" />
  </head>
  <body>
    <div id="stage">
      <section id="panel" class="panel" hidden aria-label="桌宠面板">
        <header class="panel-head">
          <h1 id="panel-title"></h1>
          <button id="panel-close" class="icon-btn" title="关闭" aria-label="关闭">×</button>
        </header>
        <div id="panel-body"></div>
      </section>

      <div id="menu" class="menu" role="menu" aria-label="选择回复模式" hidden>
        <div class="menu-title">选择回复模式</div>
        <button class="menu-item" data-mode="status" role="menuitem"><span class="check">✓</span>工作状态</button>
        <button class="menu-item" data-mode="tokens" role="menuitem"><span class="check">✓</span>Token 余量</button>
        <button class="menu-item" data-mode="chat" role="menuitem"><span class="check">✓</span>快速对话</button>
      </div>

      <div id="mode-pill" class="mode-pill" aria-live="polite"></div>

      <div id="toast" class="toast" hidden></div>

      <div id="pet" class="pet" role="button" tabindex="0" aria-label="桌面宠物"></div>
    </div>
    <script src="pet.js"></script>
  </body>
</html>
